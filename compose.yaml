name: controlplane

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-controlplane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
      POSTGRES_DB: ${POSTGRES_DB:-controlplane}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-controlplane}"]
      interval: 2s
      timeout: 3s
      retries: 15

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      # Fixed local-dev cookie. Without it, the official alpine image creates
      # /var/lib/rabbitmq/.erlang.cookie as uid 100 with mode 0400, which some
      # Docker Desktop/Windows setups cannot read (container exits with eacces).
      # This is a local-only value, not a real credential.
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-localdev-cookie}
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # management UI - http://localhost:15672 (guest/guest)
    healthcheck:
      # `ping` only proves the Erlang node is alive; the AMQP listener can
      # still be closed, so `depends_on: service_healthy` races startup. This
      # check waits until the broker actually accepts connections.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 2s
      timeout: 5s
      retries: 30

  controlplane:
    build:
      context: .
      args:
        TARGET: controlplane
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-controlplane}:${POSTGRES_PASSWORD:-localdev}@postgres:5432/${POSTGRES_DB:-controlplane}?sslmode=disable
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: .
      args:
        TARGET: worker
    environment:
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      FAIL_RATE: ${FAIL_RATE:-0}
      MIN_DELAY_MS: ${MIN_DELAY_MS:-100}
      MAX_DELAY_MS: ${MAX_DELAY_MS:-800}
      DUPLICATE_RATE: ${DUPLICATE_RATE:-0}
      REORDER: ${REORDER:-false}
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  pgdata:
